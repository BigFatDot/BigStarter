name: Publish @bigstarter/mcp-server

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    # Required for Trusted Publishing (OIDC)
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build
        run: |
          cd packages/mcp-server
          npm install
          npm run build

      - name: Publish (Trusted Publishing — no token needed)
        run: npm publish --workspace=packages/mcp-server --access public --provenance
        # --provenance attaches a signed attestation linking the package to this exact commit
        # NODE_AUTH_TOKEN not needed — OIDC handles auth automatically
