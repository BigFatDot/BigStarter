name: Deploy BigStarter Platform

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install platform dependencies only
        run: |
          cd apps/platform
          npm install --legacy-peer-deps

      - name: Build static export
        run: npm run build --workspace=apps/platform
        env:
          NEXT_PUBLIC_GITHUB_TOKEN: ${{ secrets.BIGSTARTER_GITHUB_TOKEN }}
          # CI=true is set automatically by GitHub Actions — next.config.ts uses it to set basePath=/BigStarter

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/platform/out

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
